[package]
name = "limitlens"
version = "0.1.0"
description = "A lightweight local usage widget for AI coding services"
authors = ["LimitLens contributors"]
edition = "2021"
rust-version = "1.88.0"

[lib]
name = "limitlens_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "limitlens"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
chrono = { version = "0.4.41", default-features = false, features = ["clock", "serde"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tauri = { version = "2.6.3", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2.3.4"
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["sync", "time", "rt", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
